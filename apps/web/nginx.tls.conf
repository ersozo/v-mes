# Giriş denemeleri: IP başına dakikada 10 (API ayrıca kullanıcı adı başına kilitler)
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

server {
  listen 8080;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 8443 ssl;
  http2 on;
  server_name _;
  ssl_certificate /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  root /usr/share/nginx/html;

  # Upstream adları her istekte (10 sn önbellekle) Docker DNS'inden çözülür: api/ingestion konteyneri
  # yeniden oluşturulup yeni IP alınca nginx'i yeniden başlatmak gerekmez (aksi halde 502).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;
  set $ingestion_upstream http://ingestion:3001;
  server_tokens off;

  # Not: bir location kendi add_header'ını tanımlarsa üst seviyedekiler devralınmaz → her yerde include
  include /etc/nginx/mes/security-headers.tls.conf;

  location = /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass $ingestion_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    include /etc/nginx/mes/security-headers.tls.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    include /etc/nginx/mes/security-headers.tls.conf;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
