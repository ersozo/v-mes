[project]
name = "vmes-simulator"
version = "0.1.0"
description = "S7-1200/1500 PLC simülatörü (gerçek S7 protokolü, python-snap7 sunucusu)"
requires-python = ">=3.12"
dependencies = [
    "python-snap7==3.2.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
vmes-simulator = "simulator.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
