[project]
name = "vmes-api"
version = "0.1.0"
description = "MES analitik ve konfigürasyon API'si"
requires-python = ">=3.12"
dependencies = [
    "pymssql==2.4.4",
    "httpx>=0.28",
    "pydantic>=2.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mes_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
