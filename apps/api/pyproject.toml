[project]
name = "vmes-api"
version = "0.1.0"
description = "MES analitik ve konfigürasyon API'si"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pymssql==2.4.4",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "argon2-cffi==25.1.0",
    "PyJWT==2.15.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mes_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
